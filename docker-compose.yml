version: "3.9"
services:
  jupyter-grass:
    build: .
    container_name: jupyter-gis
    volumes:
      - .:/code
      - type: bind
        source: "/Volumes/NO NAME/"
        target: /code/pen
        bind:
          create_host_path: false
    ports:
      - "8889:8889"
    environment:
      - TZ=Europe/Lisbon
    tty: true
